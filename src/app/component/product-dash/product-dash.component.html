<h2 class="text-center text-white">Product Dashbored</h2>


<div class="row mb-3">
    <div class="col-md-4" >
        <ul class="list-group">
            <li class="list-group-item"
            [routerLink]="['/products',prod.pid]"
            [queryParams]="{
                canReturn:prod.canReturn
            }"
            [queryParamsHandling]="'merge'"
            *ngFor="let prod of prodArr">
                {{prod.pname}} 
            </li>
        </ul>   
    </div>
    <div class="col-md-8">
        <router-outlet></router-outlet>
    </div>


</div>

<div class="row mb-5">
    <div class="col-md-12">
        <button
        routerLink="/products/add"
        mat-raised-button color="primary" class="text-right">Add Procuct</button>
    </div>
</div>
