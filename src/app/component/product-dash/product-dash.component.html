<h2 class="text-center text-white">Product Dashbored</h2>
<div class="row mb-5">
    <div class="col-md-12">
        <button
        routerLink="/products/add"
        mat-raised-button color="primary" class="text-left">Add Procuct</button>
    </div>
</div>

<div class="row">
    <div class="col-md-6 offset-md-3" >
        <ul class="list-group">
            <li class="list-group-item"
            [routerLink]="['/products',prod.pid]"
            *ngFor="let prod of prodArr">
                {{prod.pname}} 
            </li>
        </ul>
    </div>
</div>
